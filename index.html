<!doctype html>
<html lang="en" data-theme="night" data-deck="science">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmopoiesis</title>
  <meta name="description" content="One world: the Solar System in its spacetime, every point of it addressable in every frame and chart, read by physical and virtual instruments acquired in real time.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23EE8FBD'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5' fill='none' stroke='%23B892DD' stroke-width='1.8' transform='rotate(-24 16 16)'/%3E%3Ccircle cx='27' cy='11' r='2' fill='%23F4E8F3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Source+Sans+3:wght@400..700&family=Source+Code+Pro:wght@400..600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <canvas id="globe" aria-label="The world: drag to move, scroll to zoom, right-drag to turn and tilt, double-click to fly closer"></canvas>
  <canvas id="labels" aria-hidden="true"></canvas>
  <div class="hud" aria-hidden="true">
    <div class="reticle"></div>
    <div class="focus" id="hud-focus"></div>
  </div>
  <div class="compass" id="compass" title="The body's north at the centre of the view" role="button" tabindex="0" aria-label="The body's north: turn north up">
    <svg viewBox="0 0 40 40" width="46" height="46" aria-hidden="true">
      <circle cx="20" cy="20" r="18" class="ring"/>
      <g id="compass-needle"><path d="M20 5 L23.5 20 L20 18 L16.5 20 Z" class="north"/><path d="M20 35 L23.5 20 L20 22 L16.5 20 Z" class="south"/></g>
      <text x="20" y="11.5" text-anchor="middle">N</text>
    </svg>
  </div>

  <header class="glare">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="currentColor"/><ellipse cx="16" cy="16" rx="13" ry="5.5" fill="none" stroke="var(--orchid)" stroke-width="1.6" transform="rotate(-24 16 16)"/><circle cx="27" cy="11" r="2" fill="var(--ink)"/></svg>
      <span class="name">Cosmopoiesis</span>
      <span class="sub">one world · its spacetime · its instruments</span>
    </div>
    <div class="clocks" id="clocks"></div>
    <div class="annunciators" id="annunciators" aria-label="Annunciators"></div>
    <div class="tools">
      <div class="deck" role="group" aria-label="The deck">
        <button type="button" class="key small" data-deck="science" title="The world first: the point chosen, its environment, the field about it, the instruments' readings">Science</button>
        <button type="button" class="key small" data-deck="engineering" title="The machinery: the catalogue of frames, the bus of readings, the scheduling, the engine and its data">Engineering</button>
      </div>
      <button type="button" class="key icon" id="theme" title="Night or day" aria-label="Night or day">◐</button>
    </div>
  </header>

  <nav class="context" id="context" aria-label="The context: what is looked at, from where, at which point, in which frame, read by which instruments">
    <button type="button" class="ctx view" id="ctx-view" title="What the camera looks at (the reticle at the centre of the view)">
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" class="glyph-line"/><path d="M8 1v4M8 11v4M1 8h4M11 8h4" class="glyph-line"/></svg>
      <span class="ctx-text"><span class="ctx-label">View</span><span class="ctx-value" id="ctx-view-value">—</span></span>
    </button>
    <button type="button" class="ctx point grow" id="ctx-point" title="The point chosen, the place every display studies: click the world to choose it">
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.2" class="glyph-point"/><path d="M8 0.5v4M8 11.5v4M0.5 8h4M11.5 8h4" class="glyph-point"/></svg>
      <span class="ctx-text"><span class="ctx-label">Point chosen</span><span class="ctx-value" id="ctx-point-value">none: click the world</span></span>
    </button>
    <button type="button" class="ctx observer grow" id="ctx-observer" title="Where the instruments mounted on the observer read from">
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 L13.5 8 L8 14.5 L2.5 8 Z" class="glyph-observer"/></svg>
      <span class="ctx-text"><span class="ctx-label">Observer</span><span class="ctx-value" id="ctx-observer-value">—</span></span>
    </button>
    <button type="button" class="ctx frame" id="ctx-frame" title="The frame in which positions on the body in view are written">
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13 L3 3 M3 13 L13 13 M3 13 L9 7.5" class="glyph-line"/></svg>
      <span class="ctx-text"><span class="ctx-label">Frame</span><span class="ctx-value" id="ctx-frame-value">—</span></span>
    </button>
    <button type="button" class="ctx mounts" id="ctx-mounts" title="The instruments of the session, by where they are mounted">
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="9" r="5.5" class="glyph-line"/><path d="M8 9 L11 5.5" class="glyph-line"/><path d="M5 2h6" class="glyph-line"/></svg>
      <span class="ctx-text"><span class="ctx-label">Instruments</span><span class="ctx-value" id="ctx-mounts-value">—</span></span>
    </button>
    <div class="ctx relation" id="ctx-relation"><span class="ctx-text"><span class="ctx-label">&nbsp;</span><span class="ctx-value" id="ctx-relation-value"></span></span></div>
  </nav>

  <section class="mfd left bezel" id="mfd-left" aria-label="The left display"></section>
  <section class="mfd right bezel" id="mfd-right" aria-label="The right display"></section>

  <footer class="cdu bezel" id="cdu">
    <div class="bodies">
      <div class="label"><span>Focus</span><span id="focus-name"></span></div>
      <div class="grid" id="body-keys"></div>
    </div>
    <form class="address" id="address" autocomplete="off" role="search">
      <div class="label"><span>Spacetime address</span><span id="address-help">a place's name, coordinates, or an address · examples: click the line</span></div>
      <div class="line" style="position:relative">
        <input id="address-input" type="text" spellcheck="false" placeholder="Tycho · moon(43.31 S, 11.36 W) · earth(48.8584 N, 2.2945 E) @ now" aria-label="A spacetime address">
        <button type="submit" class="key">Go</button>
        <ul class="results bezel" id="address-results" role="listbox" hidden></ul>
      </div>
      <div class="echo" id="address-echo">—</div>
    </form>
    <div class="time">
      <div class="label"><span>World clock</span><span id="clock-away"></span></div>
      <div class="controls" id="time-keys"></div>
      <div class="readout" id="time-readout">—</div>
    </div>
    <div class="messages">
      <div class="label"><span>Messages</span><button type="button" class="link" id="messages-all">all</button></div>
      <ol id="messages"></ol>
    </div>
  </footer>

  <footer class="statusline" id="statusline">
    <span id="cursor">—</span>
    <span id="eye"></span>
    <span id="tiles"></span>
    <span class="credits" id="credits"></span>
  </footer>

  <div class="card bezel" id="sat-card" hidden></div>
  <div class="card bezel" id="setup-card" hidden></div>
  <div class="tip" id="tip" hidden></div>
</body>
</html>
